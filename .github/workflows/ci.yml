name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: true

      - name: Verify Dependencies
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Run Tests
        run: go test -v -race ./...

      - name: Build Binary
        run: make build
